name: test web

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - package.json
      - bun.lock
      - tsconfig.base.json
      - .github/workflows/test-package.yml
      - .github/workflows/test-web.yml

jobs:
  test:
    uses: ./.github/workflows/test-package.yml
    with:
      path: apps/web
