name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Explicit bash runs with pipefail, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag is on main and matches the CLI version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code ships: a tag on a commit that is not on main releases nothing.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: Compare the tag with packages/cli/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match packages/cli/package.json version $version (expected v$version)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Installs the tsgo build for this runner's platform, which ships as the sidecar.
      - run: bun install --frozen-lockfile
      - name: Package
        id: package
        run: |
          archive="$(bun packages/cli/scripts/package-release.ts | tail -n 1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Smoke-test without Node, Bun or TypeScript
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: packages/cli/scripts/smoke-release.sh "$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuhokai-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Signed build provenance: `gh attestation verify <archive> -R <repo>`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuhokai-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" \
            "${prerelease[@]}" *.tar.gz SHA256SUMS
