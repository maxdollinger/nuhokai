# Reusable: installs the workspace and runs `bun test` in one package.
name: test-package

on:
  workflow_call:
    inputs:
      path:
        description: Package directory, relative to the repo root
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --pass-with-no-tests
        working-directory: ${{ inputs.path }}
