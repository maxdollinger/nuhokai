name: ci

on:
  pull_request:
    branches: [main]

jobs:
  # Decides which of the jobs below have anything to do for this PR.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.packages.outputs.changes }}
      biome: ${{ steps.biome.outputs.biome }}
    steps:
      - uses: actions/checkout@v4
      - id: packages
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workspace: &workspace
              - package.json
              - bun.lock
              - tsconfig.base.json
              - .github/workflows/ci.yml
            shared: &shared
              - *workspace
              - "packages/shared/**"
            server:
              - *shared
              - "apps/server/**"
            web:
              - *shared
              - "apps/web/**"
      - id: biome
        uses: dorny/paths-filter@v3
        with:
          filters: |
            biome:
              - "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
              - biome.json
              - .github/workflows/ci.yml

  test:
    needs: changes
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        # `workspace` only feeds the package filters; it is not a package.
        exclude:
          - package: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --pass-with-no-tests
        working-directory: ${{ matrix.package == 'shared' && 'packages/shared' || format('apps/{0}', matrix.package) }}

  format:
    needs: changes
    if: ${{ needs.changes.outputs.biome == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome format .

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.biome == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Lint rules plus assists (import sorting); formatting is the format job's.
      - run: bunx biome check --formatter-enabled=false .
