name: ci

on:
  pull_request:
    branches: [main]

# A new push to the PR supersedes the runs for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Decides which of the jobs below have anything to do for this PR.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.packages.outputs.changes }}
      biome: ${{ steps.biome.outputs.biome }}
    # On pull_request, paths-filter reads the changed files from the API; no checkout needed.
    steps:
      - id: packages
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workspace: &workspace
              - package.json
              - bun.lock
              - tsconfig.base.json
              - .github/workflows/ci.yml
              - ".github/actions/**"
            shared: &shared
              - *workspace
              - "packages/shared/**"
            server:
              - *shared
              - "apps/server/**"
            web:
              - *shared
              - "apps/web/**"
      - id: biome
        uses: dorny/paths-filter@v3
        with:
          filters: |
            biome:
              - "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
              - biome.json
              # Biome honours .gitignore; bun.lock pins the Biome version.
              - .gitignore
              - bun.lock
              - .github/workflows/ci.yml
              - ".github/actions/**"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        # `workspace` only feeds the package filters; it is not a package.
        exclude:
          - package: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun test --pass-with-no-tests
        working-directory: ${{ matrix.package == 'shared' && 'packages/shared' || format('apps/{0}', matrix.package) }}

  typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        exclude:
          - package: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run typecheck
        working-directory: ${{ matrix.package == 'shared' && 'packages/shared' || format('apps/{0}', matrix.package) }}

  format:
    needs: changes
    if: ${{ needs.changes.outputs.biome == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bunx biome format .

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.biome == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Lint rules plus assists (import sorting); formatting is the format job's.
      - run: bunx biome check --formatter-enabled=false .

  # The single check to mark as required: the jobs above are skipped when their
  # paths didn't change, and their names depend on the matrix.
  ci-ok:
    needs: [changes, test, typecheck, format, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
