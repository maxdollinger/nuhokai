<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuhokai map</title>
<style>
:root{
  --bg-a:#f4f3ef;--bg-b:#e4e3dd;
  --panel:rgba(255,255,255,0.88);--panel-border:rgba(20,20,19,0.10);
  --text:#1d1d1b;--text-2:#5a5955;--shadow:0 2px 10px rgba(20,30,40,0.08);--accent:#185FA5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-a:#1f2120;--bg-b:#121313;
    --panel:rgba(36,36,34,0.88);--panel-border:rgba(255,255,255,0.10);
    --text:#f1efe8;--text-2:#b4b2a9;--shadow:0 2px 10px rgba(0,0,0,0.35);--accent:#85B7EB;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,var(--bg-a),var(--bg-b));color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
#wrap{position:fixed;inset:0;cursor:grab}
#wrap canvas{display:block;touch-action:none}
.panel{background:var(--panel);border:0.5px solid var(--panel-border);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px}
#crumbs{position:absolute;left:16px;top:16px;z-index:3;padding:7px 12px;font-size:13px;max-width:calc(100% - 32px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumbs .link{cursor:pointer;color:var(--text-2)}
#crumbs .link:hover{color:var(--text);text-decoration:underline}
#crumbs .cur{font-weight:600}
#crumbs .sep{opacity:0.45;margin:0 6px}
#find{position:absolute;left:16px;top:58px;z-index:4;width:min(320px,calc(100% - 32px));padding:4px;cursor:default}
#find:focus-within{border-color:var(--accent)}
#q{display:block;width:100%;padding:6px 8px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:13px;outline:none;cursor:text}
#q::placeholder{color:var(--text-2)}
#hits{margin-top:4px;padding-top:4px;border-top:0.5px solid var(--panel-border);max-height:min(360px,calc(100vh - 160px));overflow:auto}
#hits[hidden]{display:none}
#hits .hit{padding:5px 8px;border-radius:7px;cursor:pointer}
#hits .hit:hover,#hits .hit[aria-selected="true"]{background:rgba(127,127,127,0.14)}
#hits .h-name,#hits .h-path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hits .h-name b{font-weight:600;color:var(--accent)}
#hits .h-path{font-size:11px;color:var(--text-2)}
#hits .h-none,#hits .h-more{padding:5px 8px;color:var(--text-2)}
#hits .hole .h-name{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#controls{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:3;
  display:flex;flex-direction:column;gap:4px;padding:6px}
#controls button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:7px;
  background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
#controls button:hover{background:rgba(127,127,127,0.14)}
#controls button:focus-visible{outline:2px solid #378ADD;outline-offset:1px}
#controls svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#info{position:absolute;left:16px;bottom:16px;z-index:3;max-width:min(580px,calc(100% - 32px));
  padding:9px 12px;font-size:13px;line-height:1.45;color:var(--text-2)}
#info .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px;vertical-align:baseline}
#tip{position:fixed;pointer-events:none;display:none;z-index:4;background:rgba(30,30,28,0.92);color:#fff;
  font-size:12px;padding:6px 10px;border-radius:6px;white-space:pre;line-height:1.5}
@media (max-width:520px){#controls{top:auto;bottom:110px;transform:none}}
#details{position:absolute;right:16px;top:16px;z-index:3;width:300px;max-height:calc(100% - 32px);overflow:auto;padding:14px 16px;font-size:13px}
#details[hidden]{display:none}
.d-head{display:flex;gap:8px;align-items:flex-start}
.d-title{flex:1;min-width:0}
.d-name{font-size:16px;font-weight:600;line-height:1.3}
.d-sub{color:var(--text-2);margin-top:2px}
.d-close{border:0;background:transparent;color:var(--text-2);font-size:20px;line-height:1;cursor:pointer;padding:2px 7px;border-radius:6px}
.d-close:hover{background:rgba(127,127,127,0.14);color:var(--text)}
.d-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:3px 9px;border-radius:999px;background:rgba(127,127,127,0.12);font-size:12px}
.d-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-purpose{margin-top:10px;line-height:1.45}
.d-label{margin-top:14px;margin-bottom:2px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.d-list{list-style:none}
.d-list li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:0.5px solid var(--panel-border)}
.d-meta{color:var(--text-2);text-align:right;overflow-wrap:anywhere}
.d-hit>span:first-child{font-weight:600;color:var(--accent)}
.d-none{color:var(--text-2);padding:5px 0;border-top:0.5px solid var(--panel-border)}
.d-link{cursor:pointer;color:var(--accent)}
.d-link:hover{text-decoration:underline}
.d-action{margin-top:14px;width:100%;padding:8px;border-radius:7px;border:0.5px solid var(--panel-border);background:rgba(127,127,127,0.08);color:var(--text);font:inherit;cursor:pointer}
.d-action:hover{background:rgba(127,127,127,0.16)}
@media (max-width:640px){#details{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:45%}#hits{max-height:35vh}}
</style>
</head>
<body>
<section id="wrap" aria-label="3D map of the world">
  <div id="crumbs" class="panel"></div>
  <div id="find" class="panel">
    <input id="q" type="text" placeholder="Search  /" aria-label="Search nodes, ports and holes" role="combobox" aria-controls="hits" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <div id="hits" role="listbox" aria-label="Search results" hidden></div>
  </div>
  <div id="controls" class="panel">
    <button id="resetBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Reset view</button>
    <button id="layoutBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/><path d="M14 7h3a3 3 0 0 1 3 3"/><path d="M10 17H7a3 3 0 0 1-3-3"/></svg>Reset layout</button>
    <button id="raiseBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6 6 6-6"/></svg><span>Land nodes</span></button>
  </div>
  <p id="info" class="panel"></p>
  <aside id="details" class="panel" hidden aria-live="polite"></aside>
  <div id="tip"></div>
</section>
<script type="application/json" id="nuhokai-world">"nuhokai:world"</script>
<script>/*nuhokai:three*/</script>
<script type="module">
/*nuhokai:scene*/

// ---------- viewer ----------
const wrap=document.getElementById('wrap'),tip=document.getElementById('tip'),info=document.getElementById('info'),crumbs=document.getElementById('crumbs'),q=document.getElementById('q'),hitList=document.getElementById('hits');
const W=()=>window.innerWidth,H=()=>window.innerHeight;
const DARK=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
const TOUCH=window.matchMedia&&window.matchMedia('(hover: none)').matches;
// colours and light as three.js r128 drew them: hex values used as given, no sRGB conversion, legacy light units (×π)
THREE.ColorManagement.enabled=false;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W(),H());renderer.setClearColor(0x000000,0);
const el=renderer.domElement;wrap.prepend(el);
const scene=new THREE.Scene();
const FR=30;const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,700);
function frustum(){const a=W()/H();camera.left=-FR*a/2;camera.right=FR*a/2;camera.top=FR/2;camera.bottom=-FR/2;camera.updateProjectionMatrix();}
frustum();
const controls=new THREE.OrbitControls(camera,el);controls.enableDamping=true;controls.dampingFactor=0.1;controls.minZoom=0.15;controls.maxZoom=14;controls.zoomToCursor=true;controls.screenSpacePanning=true;controls.maxPolarAngle=Math.PI/2-0.12;
const CAMDIR=new THREE.Vector3(0.8,1.1,-1).normalize();
scene.add(new THREE.HemisphereLight(0xffffff,DARK?0x30302e:0xd8d6cf,(DARK?0.75:0.85)*Math.PI));
const sun=new THREE.DirectionalLight(0xffffff,(DARK?0.5:0.55)*Math.PI);sun.position.set(18,40,-24);scene.add(sun);scene.add(sun.target);
const world=new THREE.Group();scene.add(world);
function M(color,o){return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:0.8,metalness:0},o||{}));}
// three.js compiles an opaque material to draw alpha 1, so a material turning transparent needs a new program
function op(mat,o){const t=o<1;if(mat.transparent!==t){mat.transparent=t;mat.needsUpdate=true;}mat.opacity=o;mat.depthWrite=o>=1;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);const UPV=V(0,1,0);
// palette
const SLAB=DARK?0x5c5d57:0xFFFFFF,EDGE=DARK?0xf1efe8:0x2c2c2a,GROUND=DARK?0x1b1d1c:0xA3A197,BOARDSIDE=DARK?0x0f1010:0x9E9B90,GRIDC=DARK?0xB4B2A9:0x4a4945;
// a lit label in a query: tinted toward the accent, pale in the light theme so its text stays dark
const LITLAB=DARK?0x85B7EB:0xC9DEF4;
const LANEC=DARK?0xC3C2B7:0x6d6b67,CORAL=0xD85A30,GREEN=0x639922,ORANGE=0xE8932A,VIOLET=DARK?0xA59EF0:0x7F77DD,GHOST=DARK?0x9c9a91:0x8a8880,PIT=DARK?0x050606:0x5f5e5a;
const EXTC=0xEFB860,EXTD=0xC98A2E,EXTPAD=DARK?0x5a4724:0xC4A570;
// island colour = status: top and band, tuned per theme so every status stands off the board
const TOP=DARK?{planned:0x8792AA,building:0x3F8FE0,built:0x6FA834,deprecated:0xC9694A}:{planned:0x76819A,building:0x4C8CCB,built:0x76A443,deprecated:0xC0705A};
const BAND=DARK?{planned:0x7C869A,building:0x3F8FE0,built:0x6FA834,deprecated:0xC0623F}:{planned:0x5F6B80,building:0x2A78C8,built:0x4F8A17,deprecated:0xA44A2E};
const PILLARC=[0xF0997B,0x5DCAA5,0xAFA9EC,0xEFB860,0x85B7EB,0xD4537E];
const LV=3.2,NP=8,SH=1.1,SETTLED=0.01;
function rnd(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);}
// FNV-1a, 32 bits
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),0x01000193);return h>>>0;}
const DOT=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.beginPath();x.arc(16,16,11,0,Math.PI*2);x.fillStyle='#fff';x.fill();return new THREE.CanvasTexture(c);})();
// dashes along a lane: an alpha stripe repeated over the tube's length
const DASH=(()=>{const c=document.createElement('canvas');c.width=2;c.height=8;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,2,8);x.fillStyle='#fff';x.fillRect(0,0,2,5);return c;})();
const PVS='varying vec3 vW;void main(){vW=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.0);}';
const GRIDF='uniform vec2 uC;uniform float uR;uniform vec3 uCol;varying vec3 vW;void main(){vec2 p=vW.xz;float r=length(p-uC);if(r>uR)discard;vec2 g=abs(fract(p-0.5)-0.5)/fwidth(p);float l1=1.0-min(min(g.x,g.y),1.0);vec2 q=p/5.0;vec2 g2=abs(fract(q-0.5)-0.5)/fwidth(q);float l2=1.0-min(min(g2.x,g2.y),1.0);float fade=1.0-smoothstep(uR*0.7,uR,r);gl_FragColor=vec4(uCol,(l1*0.06+l2*0.15)*fade);}';

// ---------- model: the loaded world, as scene.js sees it ----------
const MAP=mapScene(JSON.parse(document.getElementById('nuhokai-world').textContent));
// the page's title is the top level's name: the world's name, as the first breadcrumb shows it
document.title=scopeView(MAP,null).name;
const LAYOUTS={};const layoutOf=scope=>LAYOUTS[scope===null?'world':scope]=LAYOUTS[scope===null?'world':scope]||{};
// moved positions, kept per browser under one key per world: {scope: {item: {x,z} or {ang}}}. The key ends in the world's
// id, since every file:// map shares one storage; the scope is the world's id or its dome's node id, the item its node
// id, so a regenerated map reuses them for the nodes it still has. Storage may be unavailable.
const STORE='nuhokai.map.layout.'+MAP.world.id;
function stored(){try{const all=JSON.parse(localStorage.getItem(STORE));return all&&typeof all==='object'?all:{};}catch(e){return {};}}
function store(all){try{localStorage.setItem(STORE,JSON.stringify(all));}catch(e){}}
const scopeKey=scope=>scope===null?MAP.world.id:MAP.nodes[scope].id;
// a hole has no id: its description and users key it, so two holes with one description keep apart
const keyOf=sp=>sp.node?sp.node.id:sp.kind==='hole'?'tbd:'+sp.item.name+':'+sp.item.users.join(','):sp.id;
function remember(sp,pos){const all=stored(),k=scopeKey(S.scope);all[k]=Object.assign({},all[k],{[keyOf(sp)]:pos});store(all);}
function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

// ---------- geometry helpers ----------
function discGeo(r,h){return new THREE.CylinderGeometry(r,r,h,48).translate(0,h/2,0);}
// children on top of an island: one ring of up to 6, else a centre and rings of 6, 12, … in a disc of radius a; childR is each child's radius
function ringSpots(n,a){if(n===1)return{spots:[{x:0,z:0}],childR:a*0.5};
const centre=n>6,rings=[];for(let k=1,left=centre?n-1:n;left>0;k++){const m=centre?Math.min(6*k,left):left;rings.push(m);left-=m;}
const d=a/(rings.length+0.4),spots=centre?[{x:0,z:0}]:[];
rings.forEach((m,i)=>{const k=i+1;for(let j=0;j<m;j++){const t=j*2*Math.PI/m+k*0.5;spots.push({x:Math.cos(t)*k*d,z:Math.sin(t)*k*d});}});
return{spots:spots,childR:d*0.4};}
function discShape(r){const s=new THREE.Shape();s.absarc(0,0,r,0,Math.PI*2,false);return s;}
function circlePts(r){const a=[];for(let i=0;i<=64;i++){const t=i/64*Math.PI*2;a.push(V(Math.cos(t)*r,0,Math.sin(t)*r));}return a;}
function radius(parts){return Math.min(2.4,0.9*Math.sqrt(Math.max(1,parts)));}
function convexHull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
function labelSprite(name,sub,dot){const pad=14,f1='600 28px system-ui,-apple-system,sans-serif',f2='400 22px system-ui,-apple-system,sans-serif';const cv=document.createElement('canvas');const x=cv.getContext('2d');x.font=f1;const w1=x.measureText(name).width+(dot!=null?22:0);x.font=f2;const w2=sub?x.measureText(sub).width:0;const w=Math.ceil(Math.max(w1,w2)+pad*2),h=sub?80:50;cv.width=w;cv.height=h;
x.fillStyle=DARK?'rgba(40,40,38,0.94)':'rgba(255,255,255,0.95)';x.strokeStyle=DARK?'rgba(255,255,255,0.16)':'rgba(20,20,19,0.16)';x.lineWidth=2;x.beginPath();if(x.roundRect)x.roundRect(1,1,w-2,h-2,10);else x.rect(1,1,w-2,h-2);x.fill();x.stroke();
let tx=pad;if(dot!=null){x.fillStyle='#'+new THREE.Color(dot).getHexString();x.beginPath();x.arc(pad+6,26,6,0,Math.PI*2);x.fill();tx+=22;}
x.textBaseline='middle';x.fillStyle=DARK?'#f1efe8':'#1d1d1b';x.font=f1;x.fillText(name,tx,26);if(sub){x.fillStyle=DARK?'#b4b2a9':'#6d6b67';x.font=f2;x.fillText(sub,pad,60);}
const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));sp.center.set(0.5,0);sp.scale.set(w*0.015,h*0.015,1);sp.renderOrder=10;return sp;}

// ---------- scope ----------
let S=null,T=0,path=[null],rf=1,raiseTarget=1;
function clearWorld(){world.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map&&m.map!==DOT)m.map.dispose();if(m.alphaMap)m.alphaMap.dispose();m.dispose();});});while(world.children.length)world.remove(world.children[0]);}
function buildScope(scope){clearWorld();
const view=scopeView(MAP,scope);
const sc={scope:scope,view:view,T0:T,items:{},pick:[],lanes:[],routes:{},air:[],pillars:[],anims:[],labels:{},F:{},R:{},hover:null,mark:null};S=sc;
const specs=view.items.map(item=>{const node=item.node===null?null:MAP.nodes[item.node];
if(item.kind==='island')return{id:item.key,kind:'comp',item:item,node:node,seed:node.id,R:radius(item.parts)+1.15,side:0};
if(item.kind==='external')return{id:item.key,kind:'ext',item:item,node:node,R:item.side<0?2.5:2.3,side:item.side};
if(item.kind==='hole')return{id:item.key,kind:'hole',item:item,node:null,R:1.6,side:item.side};
return{id:item.key,kind:'ghost',item:item,node:node,orange:item.kind==='entry',R:1.6,side:item.side};});
if(!specs.length)specs.push({id:'self',kind:'empty',R:2.4,side:0});
const kinds={};view.items.forEach(item=>kinds[item.key]=item.kind);
const E=view.lanes.map(l=>({from:l.from,to:l.to,kind:l.kind,port:l.ports.join(', '),io:l.kind==='entry'||kinds[l.from]==='external'||kinds[l.to]==='external',dash:l.kind==='implements'||l.kind==='hole'}));
const islands=view.items.filter(item=>item.kind==='island');const maxL=islands.length?Math.max(...islands.map(item=>item.level)):0;sc.maxL=maxL;
// level height: LV up to 6 levels, then the stack keeps the height of 6
const lv=sc.lv=maxL>6?LV*6/maxL:LV;
specs.forEach(s=>{s.level=s.kind==='comp'?s.item.level:null;s.ty=s.kind==='comp'?s.level*lv:s.side<0?(maxL+1)*lv:0;});
layout(scope,specs,E,view.pillars);
specs.forEach((sp,i)=>buildItem(sp,i));
E.forEach(e=>{const key=e.from<e.to?e.from+'|'+e.to:e.to+'|'+e.from;const r=sc.routes[key]=sc.routes[key]||{key:key,lanes:{}};const lk=e.from+'>'+e.to+'>'+e.kind;(r.lanes[lk]=r.lanes[lk]||{from:e.from,to:e.to,kind:e.kind,dash:e.dash,calls:[]}).calls.push(e);});
Object.values(sc.routes).forEach(r=>{const ls=Object.values(r.lanes);ls.forEach((ln,i)=>{ln.off=ls.length>1?(i-(ls.length-1)/2)*0.6*(ln.from<ln.to?1:-1):0;ln.io=ln.calls.some(c=>c.io);ln.key=r.key;makeLane(ln);});
sc.labels['route:'+r.key]=ls.map(ln=>itemName(ln.from)+' → '+itemName(ln.to)+':  '+laneText(ln)).join('\n');});
view.air.forEach((a,i)=>makeAir(a.from,a.to,a.ports.join(', '),i));
const ring=layoutOf(scope).ring;sc.D=ring.r+3.5;
view.pillars.forEach((p,i)=>makePillar(p,i));
makeBoard(ring);
return sc;}
function itemName(id){return S.items[id]?S.items[id].name:id;}
function laneText(ln){const ports=ln.calls.map(c=>c.port).filter(p=>p).join(', ');return ln.kind==='implements'?'implements':ln.kind==='hole'?'tbd':ports;}
function layout(scope,specs,E,pillars){const L=layoutOf(scope);const comps=specs.filter(s=>s.side===0),n=comps.length;
const first=!L.ring;

let sel=null,selPort=null,HITS=[],cur=0,lastQ=null;const SHOWN=50;
function legend(){info.innerHTML='';const t=s=>info.appendChild(document.createTextNode(s));
t('Height = call depth. Lanes are calls labelled with their ports (orange = entries and externals), violet arcs are events, dashed lanes lead to contracts and tbd holes. Island colour = status:');
['planned','building','built','deprecated'].forEach(s=>{const sw=document.createElement('i');sw.className='sw';sw.style.background='#'+new THREE.Color(BAND[s]).getHexString();info.appendChild(sw);t(s);});
t('. Click for details, drag islands or group outlines to rearrange (this browser remembers it); double-click a dome to look inside'+(TOUCH?'':', / to search')+(path.length>1?', Esc to go up.':'.'));}
function selectable(id){const it=S.items[id];return !!(it&&it.node);}
function renderDetails(){const d=document.getElementById('details');const id=sel;const it=id&&S.items[id];if(!it||!it.node){d.hidden=true;d.innerHTML='';return;}
d.innerHTML='';d.hidden=false;
const mk=(tag,cls,txt,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;(parent||d).appendChild(e);return e;};
const info=detailsOf(it.node);
const head=mk('div','d-head');const t=mk('div','d-title',null,head);const close=mk('button','d-close','×',head);close.setAttribute('aria-label','Close details');close.onclick=()=>select(null);
mk('div','d-name',info.name,t);if(info.kind)mk('div','d-sub',info.kind,t);
const chip=mk('span','d-chip');const sw=mk('i',null,null,chip);sw.style.background='#'+new THREE.Color(BAND[info.status]||BAND.planned).getHexString();mk('span',null,info.status,chip);
mk('p','d-purpose',info.purpose);
info.sections.forEach(sec=>{mk('div','d-label',sec.label);if(!sec.rows.length){mk('div','d-none','none');return;}const ul=mk('ul','d-list');sec.rows.forEach(r=>{const li=mk('li',sec.label==='Ports'&&r.name===selPort?'d-hit':null,null,ul);mk('span',null,r.name,li);if(r.meta)mk('span','d-meta',r.meta,li);});});
if(it.kind==='comp'&&it.sp.item.dome){const b=mk('button','d-action','Look inside');b.onclick=()=>enter(id);}
const hit=d.querySelector('.d-hit');if(hit)hit.scrollIntoView({block:'nearest'});}
function setLaneLook(l,col,a){if(l.tag)l.tag.material.opacity=a<0.5?0.15:1;l.rmat.color.setHex(col);l.rmat.emissive.setHex(col);l.pmat.color.setHex(0xffffff);l.amat.color.setHex(col);l.rmat.opacity=0.9*a;l.pmat.opacity=a;l.amat.opacity=0.95*a;l.arrow.visible=a>0.1;}
function applyState(){const lit=searching()?new Set(lightsFor(MAP,S.view,HITS)):null;const fid=lit?null:S.hover||sel||S.mark;const near=new Set();if(fid){near.add(fid);(S.F[fid]||[]).forEach(x=>near.add(x));(S.R[fid]||[]).forEach(x=>near.add(x));}
// a query lights its hits' items, tinted, and dims the rest harder than hover does, over hover and selection
Object.values(S.items).forEach(it=>{const on=!!lit&&lit.has(it.id),o=lit?(on?1:0.12):fid&&!near.has(it.id)?0.22:1;it.mats.forEach((m,i)=>op(m,it.baseOp[i]*o));it.label.material.opacity=o<1?(lit?0.25:0.35):1;it.label.material.color.setHex(on?LITLAB:0xffffff);it.label.renderOrder=on?11:10;
if(it.edge){const f=lit?on:fid===it.id;it.edge.color.setHex(f?CORAL:EDGE);op(it.edge,f?1:it.edgeOp*o);}});
S.lanes.forEach(l=>{if(lit)setLaneLook(l,laneColor(l),0.08);else if(fid){if(l.from===fid)setLaneLook(l,CORAL,1);else if(l.to===fid)setLaneLook(l,GREEN,1);else setLaneLook(l,laneColor(l),0.08);}else setLaneLook(l,laneColor(l),1);});
S.air.forEach(a=>{a.vis=!lit&&(!fid||a.from===fid||a.to===fid);a.mat.uniforms.uA.value=a.vis?0.95:0.08;a.amat.opacity=a.vis?0.95:0.08;a.label.material.opacity=a.vis?1:0.15;});
S.pillars.forEach(r=>{const o=lit||fid?0.35:1;r.tmat.opacity=0.95*o;r.fmat.opacity=0.13*o;r.label.material.opacity=o;});
legend();}
function select(id,port){sel=selectable(id)?id:null;selPort=(sel&&port)||null;S.mark=null;applyState();renderDetails();}
// a hit lands selected (the camera moved, so a hover from before is stale); a hole has no details, so it is marked as hover marks it until the next click, Escape or scope
function land(id,port){S.hover=null;select(id,port);if(!sel&&S.items[id]){S.mark=id;applyState();}}
function toggleRaise(){raiseTarget=raiseTarget?0:1;const b=document.getElementById('raiseBtn');b.querySelector('span').textContent=raiseTarget?'Land nodes':'Lift nodes';b.querySelector('svg').innerHTML=raiseTarget?'<path d="M12 19V5"/><path d="M6 11l6 6 6-6"/>':'<path d="M12 5v14"/><path d="M6 13l6-6 6 6"/>';}

// ---------- navigation ----------
let HOME={t:V(0,0,0),zoom:1},trans=null;
// home: the board's width and, above its tilted disc, the stack's height both fit the frame
function computeHome(){const r=layoutOf(S.scope).ring;const h=(S.maxL+1)*S.lv;HOME={t:V(r.cx,h*0.5,r.cz),zoom:Math.min(3,FR*W()/H()/(S.D*2.15),FR/(S.D*1.8+h*0.8))};}
function camAt(t,zoom){controls.target.copy(t);camera.position.copy(t).addScaledVector(CAMDIR,110);if(zoom!==undefined)camera.zoom=zoom;camera.updateProjectionMatrix();camera.lookAt(t);}
function renderCrumbs(){crumbs.innerHTML='';S.view.path.forEach((c,i,all)=>{const s=document.createElement('span');s.textContent=c.name;if(i<all.length-1){s.className='link';s.onclick=()=>goTo(i);}else s.className='cur';crumbs.appendChild(s);if(i<all.length-1){const sep=document.createElement('span');sep.className='sep';sep.textContent='›';crumbs.appendChild(sep);}});}
function load(scope){sel=null;buildScope(scope);computeHome();renderCrumbs();applyState();renderDetails();}
function enter(id){const it=S.items[id];if(trans||!it||it.kind!=='comp'||!it.sp.item.dome)return;trans={kind:'in1',t:0,fromT:controls.target.clone(),fromP:camera.position.clone(),fromZ:camera.zoom,toT:V(it.base.x,it.y+SH/2,it.base.z),toZ:camera.zoom*7,scope:it.sp.item.node};controls.enabled=false;tip.style.display='none';}
function goTo(d){if(trans||d>=path.length-1||d<0)return;trans={kind:'out1',t:0,fromZ:camera.zoom,toZ:camera.zoom*0.25,path:path.slice(0,d+1),from:'node:'+path[d+1]};controls.enabled=false;tip.style.display='none';}
function goUp(){goTo(path.length-2);}
function resetView(){if(trans)return;computeHome();trans={kind:'home',t:0,fromT:controls.target.clone(),toT:HOME.t.clone(),fromZ:camera.zoom,toZ:HOME.zoom,fromP:camera.position.clone()};controls.enabled=false;}
// forget what the user moved in this scope, in memory and in storage, and seed it again
function resetLayout(){if(trans)return;const all=stored();delete all[scopeKey(S.scope)];store(all);delete LAYOUTS[S.scope===null?'world':S.scope];load(S.scope);resetView();}
document.getElementById('resetBtn').addEventListener('click',resetView);
document.getElementById('layoutBtn').addEventListener('click',resetLayout);
document.getElementById('raiseBtn').addEventListener('click',toggleRaise);

// ---------- search ----------
// every node, port and tbd hole in the world, whatever scope is open; a hit lands in its home scope, centred and selected
function searching(){return q.value.trim()!=='';}
// a jump or a map click clears the query but keeps it and its row: / or Ctrl/⌘K on an empty box brings them back; Escape forgets it
function clearQuery(keep){if(!q.value)return;lastQ=keep?{v:q.value,cur:cur}:null;q.value='';onQuery();}
function restoreQuery(){if(!q.value&&lastQ){q.value=lastQ.v;onQuery();cur=lastQ.cur;renderHits();q.select();}}
function openSearch(){restoreQuery();q.focus();q.select();}
function onQuery(){HITS=search(MAP,q.value);cur=0;renderHits();applyState();}
function renderHits(){hitList.innerHTML='';const on=searching();hitList.hidden=!on;q.setAttribute('aria-expanded',String(on));q.removeAttribute('aria-activedescendant');if(!on)return;
const mk=(tag,cls,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;parent.appendChild(e);return e;};
if(!HITS.length){mk('div','h-none',hitList).textContent='No matches';return;}
HITS.slice(0,SHOWN).forEach((h,i)=>{const row=mk('div',h.kind==='hole'?'hit hole':'hit',hitList);row.id='hit'+i;row.setAttribute('role','option');row.setAttribute('aria-selected',String(i===cur));
// the label in runs, the matched characters bold
const name=mk('div','h-name',row),bold=new Set(h.positions);let from=0;for(let j=1;j<=h.label.length;j++)if(j===h.label.length||bold.has(j)!==bold.has(from)){const s=h.label.slice(from,j);if(bold.has(from))mk('b',null,name).textContent=s;else name.appendChild(document.createTextNode(s));from=j;}
mk('div','h-path',row).textContent=h.path.map(c=>c.name).join(' › ');
row.addEventListener('mousedown',e=>e.preventDefault());row.addEventListener('click',()=>jump(h));
if(i===cur){q.setAttribute('aria-activedescendant',row.id);row.scrollIntoView({block:'nearest'});}});
if(HITS.length>SHOWN){const more=mk('div','h-more',hitList);more.textContent=SHOWN+' of '+HITS.length+' — keep typing';more.addEventListener('mousedown',e=>e.preventDefault());}}
// same scope: glide there; another scope: fade out as going up does, load it, fade in centred on the hit
function jump(h){if(trans)return;cur=HITS.indexOf(h);clearQuery(true);q.blur();
if(h.scope===S.scope){const it=S.items[h.key];if(!it)return;trans={kind:'home',t:0,fromT:controls.target.clone(),toT:V(it.base.x,it.y,it.base.z),fromZ:camera.zoom,toZ:Math.max(camera.zoom,HOME.zoom*1.5),fromP:camera.position.clone(),sel:h.key,port:h.port};}
else trans={kind:'out1',t:0,fromZ:camera.zoom,toZ:camera.zoom*0.25,path:h.path.map(c=>c.scope),sel:h.key,port:h.port};
controls.enabled=false;tip.style.display='none';}
q.addEventListener('input',onQuery);
// touch screens have no / key: a tap into the empty box brings the query back
if(TOUCH){q.placeholder='Search';q.addEventListener('focus',restoreQuery);}
q.addEventListener('keydown',e=>{if(e.isComposing)return;const n=Math.min(HITS.length,SHOWN);
if((e.key==='ArrowDown'||e.key==='ArrowUp')&&n){e.preventDefault();cur=(cur+(e.key==='ArrowDown'?1:n-1))%n;renderHits();}
else if(e.key==='Enter'){e.preventDefault();if(HITS[cur])jump(HITS[cur]);}
else if(e.key==='Escape'){e.preventDefault();if(q.value)clearQuery(false);else q.blur();}});

// ---------- input ----------
const ray=new THREE.Raycaster();let down=null,drag=null;
function setRay(e){const r=el.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);}
function hitAt(e){setRay(e);const h=ray.intersectObjects(S.pick)[0];return h?h.object.userData:null;}
function planeHit(e,y){setRay(e);const p=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(UPV,-y),p)?p:null;}
function outsideBoard(e){const r=layoutOf(S.scope).ring;const p=planeHit(e,0);return !p||Math.hypot(p.x-r.cx,p.z-r.cz)>S.D;}
wrap.addEventListener('pointerdown',e=>{tip.style.display='none';if(trans||e.target!==el)return;
if(e.button===0){const h=hitAt(e);
if(h&&h.id&&S.items[h.id]&&S.items[h.id].kind!=='empty'){const it=S.items[h.id];const p=planeHit(e,it.y+it.ah);if(p){drag={kind:'item',id:h.id,x:e.clientX,y:e.clientY,moved:false,ox:it.base.x-p.x,oz:it.base.z-p.z,py:it.y+it.ah};controls.enabled=false;return;}}
if(h&&h.pillar){const rec=S.pillars.find(r=>r.gr.id===h.pillar);const p=planeHit(e,0.02);if(rec&&p){drag={kind:'pillar',rec:rec,x:e.clientX,y:e.clientY,moved:false,p0:p,start:rec.memb.map(id=>({id:id,x:S.items[id].base.x,z:S.items[id].base.z}))};controls.enabled=false;return;}}}
down={x:e.clientX,y:e.clientY,b:e.button};wrap.style.cursor='grabbing';},true);
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&dx*dx+dy*dy<20)return;drag.moved=true;wrap.style.cursor='grabbing';
if(drag.kind==='item'){const p=planeHit(e,drag.py);if(p)moveItem(drag.id,p.x+drag.ox,p.z+drag.oz);}else{const p=planeHit(e,0.02);if(p){const ddx=p.x-drag.p0.x,ddz=p.z-drag.p0.z;drag.start.forEach(s=>moveItem(s.id,s.x+ddx,s.z+ddz));}}});
el.addEventListener('pointermove',e=>{if(drag||e.buttons||trans)return;const h=hitAt(e);const key=h?(h.id||(h.air!==undefined?'air:'+h.air:(h.pillar?'pillar:'+h.pillar:(h.route?'route:'+h.route:null)))):null;const id=h&&h.id&&S.items[h.id]&&S.items[h.id].kind!=='empty'?h.id:null;if(id!==S.hover){S.hover=id;applyState();}
if(key&&S.labels[key]){tip.textContent=S.labels[key];tip.style.display='block';tip.style.left=Math.max(4,Math.min(e.clientX+14,W()-tip.offsetWidth-8))+'px';tip.style.top=Math.max(4,Math.min(e.clientY+14,H()-tip.offsetHeight-8))+'px';wrap.style.cursor=h.pillar&&!h.id?'move':'pointer';}else{tip.style.display='none';wrap.style.cursor='grab';}});
window.addEventListener('pointerup',e=>{wrap.style.cursor='grab';
if(drag){if(!drag.moved){clearQuery(true);select(drag.kind==='item'?drag.id:null);}drag=null;if(!trans)controls.enabled=true;return;}
if(down&&down.b===0&&!trans&&e.target===el){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(dx*dx+dy*dy<25){const h=hitAt(e);clearQuery(true);select(h&&h.id?h.id:null);}}down=null;});
el.addEventListener('dblclick',e=>{if(trans)return;const h=hitAt(e);if(h&&h.id){enter(h.id);return;}if(path.length>1&&outsideBoard(e))goUp();});
el.addEventListener('pointerleave',()=>{tip.style.display='none';if(S.hover){S.hover=null;applyState();}});
el.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){e.preventDefault();openSearch();return;}
// keys typed in the search box are the box's own: never a way up
if(e.target===q)return;
if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();openSearch();return;}
if(e.key==='Escape'&&searching()){clearQuery(false);return;}
if(e.key==='Escape'&&(sel||S.mark)){select(null);return;}if((e.key==='Escape'||e.key==='Backspace')&&path.length>1){e.preventDefault();goUp();}});
window.addEventListener('resize',()=>{renderer.setSize(W(),H());frustum();computeHome();});
load(null);camAt(HOME.t,HOME.zoom);controls.update();

// ---------- loop ----------
const timer=new THREE.Timer();timer.connect(document);const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);const io2=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function loop(t){requestAnimationFrame(loop);timer.update(t);const dt=Math.min(timer.getDelta(),0.05);T+=dt;
if(trans){trans.t+=dt;const k=Math.min(1,trans.t/0.7),e=io2(k);
if(trans.kind==='in1'){const tt=trans.fromT.clone().lerp(trans.toT,e);camera.position.copy(trans.fromP).add(tt.clone().sub(trans.fromT));controls.target.copy(tt);camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camera.updateProjectionMatrix();camera.lookAt(tt);el.style.opacity=String(1-Math.max(0,(k-0.5)/0.5));
if(k>=1){path.push(trans.scope);load(trans.scope);camAt(HOME.t,HOME.zoom*0.3);trans={kind:'in2',t:0,fromT:HOME.t.clone(),toT:HOME.t.clone(),fromZ:HOME.zoom*0.3,toZ:HOME.zoom};}}
else if(trans.kind==='out1'){camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camera.updateProjectionMatrix();el.style.opacity=String(1-Math.max(0,(k-0.4)/0.6));
if(k>=1){const tr=trans;path=tr.path;load(path[path.length-1]);const it=S.items[tr.sel||tr.from];const c=it?V(it.base.x,it.y,it.base.z):HOME.t.clone();
// going up starts close on the dome just left and widens to the scope; a search hit starts close and stays centred on it
const z=tr.sel?HOME.zoom*1.5:HOME.zoom,z0=z*(tr.sel?0.6:6);camAt(c,z0);trans={kind:'in2',t:0,fromT:c,toT:tr.sel?c.clone():HOME.t.clone(),fromZ:z0,toZ:z,sel:tr.sel,port:tr.port};}}
else if(trans.kind==='in2'){const tt=trans.fromT.clone().lerp(trans.toT,e);camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camAt(tt);el.style.opacity=String(Math.min(1,k*2));if(k>=1){const s=trans.sel,p=trans.port;trans=null;controls.enabled=true;controls.update();if(s)land(s,p);}}
else if(trans.kind==='home'){const tt=trans.fromT.clone().lerp(trans.toT,e);const dirNow=trans.fromP.clone().sub(trans.fromT).normalize().lerp(CAMDIR,e).normalize();controls.target.copy(tt);camera.position.copy(tt).addScaledVector(dirNow,110);camera.zoom=trans.fromZ+(trans.toZ-trans.fromZ)*e;camera.updateProjectionMatrix();camera.lookAt(tt);if(k>=1){const s=trans.sel,p=trans.port;trans=null;controls.enabled=true;controls.update();if(s)land(s,p);}}}
else if(!drag)controls.update();
const prf=rf;rf+=(raiseTarget-rf)*Math.min(1,dt*2.5);if(Math.abs(rf-raiseTarget)<1e-3)rf=raiseTarget;const raising=rf!==prf;
const lt=T-S.T0;
Object.values(S.items).forEach(it=>{it.y=rf*it.ty;});
S.anims.forEach(a=>{const e=ease((lt-a.delay)/0.6);const it=a.it;it.g.position.y=it.y+0.8*(1-e);
if(it.stem){const gy=it.g.position.y;const vis=gy>0.08;it.stem.visible=vis;it.foot.visible=vis;if(vis){it.stem.scale.y=gy;it.stem.position.y=-gy/2;it.foot.position.y=-gy+0.03;}}});
if(raising){S.lanes.forEach(routeLane);S.air.forEach(routeAir);}
const ready=lt>0.9;const p=new THREE.Vector3();
S.lanes.forEach(l=>{const arr=l.pts.geometry.attributes.position.array;const spd=1.4/l.L;for(let i=0;i<NP;i++){const u=(T*spd+l.ph+i/NP)%1;p.copy(l.S).lerp(l.P,u);arr[i*3]=p.x;arr[i*3+1]=p.y+0.04;arr[i*3+2]=p.z;}l.pts.geometry.attributes.position.needsUpdate=true;l.pts.visible=ready&&l.pmat.opacity>0.1;});
S.air.forEach(s=>{s.mat.uniforms.uTime.value=T;const u=((T*0.22+s.ph)%1.3);const on=ready&&s.vis&&u<=1;s.dot.visible=on;if(on)s.dot.position.copy(s.curve.getPoint(u));});
renderer.render(scene,camera);}
loop();
</script>
</body>
