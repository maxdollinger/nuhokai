<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuhokai map</title>
<style>
:root{
  --bg-a:#f1eee8;--bg-b:#ddd8ce;
  --panel:rgba(255,255,255,0.88);--panel-border:rgba(20,20,19,0.10);
  --text:#1d1d1b;--text-2:#5a5955;--shadow:0 2px 10px rgba(20,30,40,0.08);--accent:#185FA5;--danger:#A32D2D;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg-a:#1d2024;--bg-b:#0f1113;
    --panel:rgba(36,36,34,0.88);--panel-border:rgba(255,255,255,0.10);
    --text:#f1efe8;--text-2:#b4b2a9;--shadow:0 2px 10px rgba(0,0,0,0.35);--accent:#85B7EB;--danger:#F09595;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,var(--bg-a),var(--bg-b));color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
#wrap{position:fixed;inset:0;cursor:grab}
#wrap canvas{display:block;touch-action:none}
.panel{background:var(--panel);border:0.5px solid var(--panel-border);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px}
#crumbs{position:absolute;left:16px;top:16px;z-index:3;padding:7px 12px;font-size:13px;max-width:calc(100% - 32px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumbs .link{cursor:pointer;color:var(--text-2)}
#crumbs .link:hover{color:var(--text);text-decoration:underline}
#crumbs .cur{font-weight:600}
#crumbs .sep{opacity:0.45;margin:0 6px}
#crumbs.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}to{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){#crumbs.flash{animation:none}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#find{position:absolute;left:16px;top:58px;z-index:4;width:min(320px,calc(100% - 32px));padding:4px;cursor:default}
#find:focus-within{border-color:var(--accent)}
#q{display:block;width:100%;padding:6px 8px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:13px;outline:none;cursor:text}
#q::placeholder{color:var(--text-2)}
#hits{margin-top:4px;padding-top:4px;border-top:0.5px solid var(--panel-border);max-height:min(360px,calc(100vh - 160px));overflow:auto}
#hits[hidden]{display:none}
#hits .hit{padding:5px 8px;border-radius:7px;cursor:pointer}
#hits .hit[aria-selected="true"]{background:rgba(127,127,127,0.22)}
#hits .h-name,#hits .h-path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hits .h-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:baseline}
#hits .hole .h-dot{border:1.5px dashed var(--text-2)}
#hits .h-name b{font-weight:600;color:var(--accent)}
#hits .h-path{font-size:11px;color:var(--text-2)}
#hits .h-none,#hits .h-more,#here{padding:5px 8px;color:var(--text-2)}
#here{font-size:12px}
#here[hidden]{display:none}
#hits .hole .h-name{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#controls{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:3;
  display:flex;flex-direction:column;gap:4px;padding:6px}
#controls button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:7px;
  background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
#controls button:hover,#helpBtn:hover{background:rgba(127,127,127,0.14)}
#controls button[aria-pressed="true"]{color:var(--accent)}
#controls button:focus-visible,#helpBtn:focus-visible{outline:2px solid #378ADD;outline-offset:1px}
#controls svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#helpBtn{position:absolute;left:16px;bottom:16px;z-index:3;width:36px;height:36px;border-radius:50%;color:var(--text);
  font:inherit;font-size:16px;font-weight:600;cursor:pointer}
#helpDlg{margin:auto;width:min(600px,calc(100% - 32px));max-height:calc(100% - 32px);padding:0;border:0.5px solid var(--panel-border);
  border-radius:12px;background:var(--bg-a);color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,0.25);font-size:13px;line-height:1.45}
#helpDlg::backdrop{background:rgba(10,10,10,0.35)}
#helpDlg .hp-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:var(--bg-a);border-bottom:0.5px solid var(--panel-border)}
#helpDlg h2{font-size:15px;font-weight:600}
#helpDlg h3{margin:16px 0 6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
#helpDlg .hp-body{padding:4px 18px 18px}
#helpDlg .hp-intro{margin-top:10px;color:var(--text-2)}
#helpDlg dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:baseline}
#helpDlg dt{display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
#helpDlg dd{color:var(--text-2)}
#helpDlg kbd{display:inline-block;min-width:18px;padding:0 5px;border:0.5px solid var(--panel-border);border-radius:4px;background:var(--panel);font:inherit;font-size:12px;text-align:center}
#helpDlg .hp-s{flex:none;display:inline-block;background:var(--f,transparent)}
#helpDlg .hp-dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
#helpDlg .hp-ring{width:11px;height:11px;border-radius:50%;border:1.5px dashed var(--c)}
#helpDlg .hp-line{width:18px;height:0;border-top:3px solid var(--c)}
#helpDlg .hp-dash{width:18px;height:0;border-top:2px dashed var(--c)}
#helpDlg .hp-arc{width:18px;height:9px;border:2px solid var(--c);border-bottom:0;border-radius:9px 9px 0 0}
#helpDlg .hp-sq{width:10px;height:10px;border-radius:2px;background:var(--c)}
@media (max-width:520px){#helpDlg dl{grid-template-columns:1fr;gap:2px}#helpDlg dd{margin-bottom:6px}}
#tip{position:fixed;pointer-events:none;display:none;z-index:4;background:rgba(30,30,28,0.92);color:#fff;
  font-size:12px;padding:6px 10px;border-radius:6px;white-space:pre;line-height:1.5}
@media (max-width:520px){#controls{top:104px;transform:none;flex-direction:row}#controls button{width:auto;padding:8px}#controls button span{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}}
#details{position:absolute;right:16px;top:16px;z-index:3;width:300px;max-height:calc(100% - 32px);overflow:auto;padding:14px 16px;font-size:13px}
#details[hidden]{display:none}
.d-head{display:flex;gap:8px;align-items:flex-start}
.d-title{flex:1;min-width:0}
.d-name{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.d-sub{color:var(--text-2);margin-top:2px}
.d-close{border:0;background:transparent;color:var(--text-2);font-size:20px;line-height:1;cursor:pointer;padding:2px 7px;border-radius:6px}
.d-close:hover{background:rgba(127,127,127,0.14);color:var(--text)}
.d-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:3px 9px;border-radius:999px;background:rgba(127,127,127,0.12);font-size:12px}
.d-chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-purpose{margin-top:10px;line-height:1.45;overflow-wrap:anywhere}
.d-why{margin-top:6px;line-height:1.45;opacity:.75;overflow-wrap:anywhere}
.d-label{margin-top:14px;margin-bottom:2px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.d-list{list-style:none}
.d-list li{padding:5px 0;border-top:0.5px solid var(--panel-border);line-height:1.4}
.d-row-name{display:block;font-weight:500;overflow-wrap:anywhere}
.d-meta{display:block;margin-top:1px;color:var(--text-2);overflow-wrap:anywhere}
.d-hit .d-row-name{font-weight:600;color:var(--accent)}
.d-list li.d-src{display:flex;align-items:center;gap:6px;padding:3px 0}
.d-path{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.d-path bdi{direction:ltr;unicode-bidi:isolate}
.d-copy{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--text-2);cursor:pointer}
.d-copy:hover{background:rgba(127,127,127,0.14);color:var(--text)}
.d-copy:focus-visible,.d-close:focus-visible{outline:2px solid #378ADD;outline-offset:1px}
#details .d-copy svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.d-copy.done{color:var(--accent)}
.d-copy.fail{color:var(--danger)}
.d-none{color:var(--text-2);padding:5px 0;border-top:0.5px solid var(--panel-border)}
.d-link{cursor:pointer;color:var(--accent)}
.d-link:hover{text-decoration:underline}
.d-action{margin-top:14px;width:100%;padding:8px;border-radius:7px;border:0.5px solid var(--panel-border);background:rgba(127,127,127,0.08);color:var(--text);font:inherit;cursor:pointer}
.d-action:hover{background:rgba(127,127,127,0.16)}
@media (max-width:640px){#helpBtn{bottom:auto;top:104px;left:auto;right:16px}#details{top:auto;bottom:16px;left:16px;right:16px;width:auto;max-height:45%}#hits{max-height:35vh}}
</style>
</head>
<body>
<section id="wrap" aria-label="3D map of the world">
  <div id="crumbs" class="panel"></div>
  <div id="find" class="panel">
    <input id="q" type="text" placeholder="Search" aria-label="Search nodes, ports and holes" role="combobox" aria-controls="hits" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false">
    <div id="here" hidden>None in this view — pick one to go there</div>
    <div id="hits" role="listbox" aria-label="Search results" hidden></div>
  </div>
  <div id="controls" class="panel">
    <button id="resetBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg><span>Reset view</span></button>
    <button id="layoutBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/><path d="M14 7h3a3 3 0 0 1 3 3"/><path d="M10 17H7a3 3 0 0 1-3-3"/></svg><span>Reset layout</span></button>
    <button id="conesBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 9H5z"/><path d="M12 21l7-9H5z"/></svg><span>Cones: off</span></button>
  </div>
  <button id="helpBtn" class="panel" type="button" aria-label="How to read this map" aria-haspopup="dialog">?</button>
  <dialog id="helpDlg" aria-labelledby="helpTitle"><div class="hp-head"><h2 id="helpTitle">How to read this map</h2><button class="d-close" type="button" aria-label="Close">×</button></div><div class="hp-body"></div></dialog>
  <aside id="details" class="panel" hidden aria-live="polite"></aside>
  <div id="tip"></div>
  <div id="say" class="sr" aria-live="polite"></div>
</section>
<script type="application/json" id="nuhokai-world">"nuhokai:world"</script>

<script type="module">
/*nuhokai:scene*/

// ---------- viewer ----------
const wrap=document.getElementById('wrap'),tip=document.getElementById('tip'),helpDlg=document.getElementById('helpDlg'),crumbs=document.getElementById('crumbs'),q=document.getElementById('q'),hitList=document.getElementById('hits'),here=document.getElementById('here'),sayBox=document.getElementById('say');
const W=()=>window.innerWidth,H=()=>window.innerHeight;
const DARK=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
const TOUCH=window.matchMedia&&window.matchMedia('(hover: none)').matches;
const APPLE=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
// colours and light as three.js r128 drew them: hex values used as given, no sRGB conversion, legacy light units (×π)
THREE.ColorManagement.enabled=false;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W(),H());renderer.setClearColor(0x000000,0);
const el=renderer.domElement;wrap.prepend(el);
const scene=new THREE.Scene();
const FR=30;const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,700);
function frustum(){const a=W()/H();camera.left=-FR*a/2;camera.right=FR*a/2;camera.top=FR/2;camera.bottom=-FR/2;camera.updateProjectionMatrix();}
frustum();
const controls=new THREE.OrbitControls(camera,el);controls.enableDamping=true;controls.dampingFactor=0.1;controls.minZoom=0.15;controls.maxZoom=14;controls.zoomToCursor=true;controls.screenSpacePanning=true;controls.maxPolarAngle=Math.PI/2-0.12;
const CAMDIR=new THREE.Vector3(0.8,1.1,-1).normalize();
scene.add(new THREE.HemisphereLight(0xffffff,DARK?0x30302e:0xd8d6cf,(DARK?0.7:0.62)*Math.PI));
const sun=new THREE.DirectionalLight(0xffffff,(DARK?0.45:0.4)*Math.PI);sun.position.set(18,40,-24);scene.add(sun);scene.add(sun.target);
const world=new THREE.Group();scene.add(world);
// three.js compiles an opaque material to draw alpha 1, so a material turning transparent needs a new program
function op(mat,o){const t=o<1;if(mat.transparent!==t){mat.transparent=t;mat.needsUpdate=true;}mat.opacity=o;mat.depthWrite=o>=1;}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);const UPV=V(0,1,0);
// palette: warm paper in the light theme, neutral graphite in the dark one; colour only where it means something.
// used: what depends on a node (filled dots, lanes into it), dep: what it depends on (hollow rings, lanes out of it):
// blue and red differ in shape on the ground and in brightness, so they stay apart without colour vision too
const TH=DARK?{g:['#1f2328','#181b1f','#121417'],side:0x0c0d0f,rim:0x6b737c,ring:0xa4adb6,ringOp:0.16,tone:'#8c949c',tower:0x5e6a70,towerOp:0.85,lit:0.3,glow:0.75,edge:0xc3ccd0,edgeOp:0.4,floorOp:0.2,focus:0xf2f5f4,call:0xbcc4c7,callA:0.62,inner:0xe8eeec,label:'#e6ebe9',shadow:'rgba(0,0,0,0.95)',used:0x9cc8ff,dep:0xd9572a,ext:0xE8932A,extA:0.55,event:0xA066FF,ghost:0x9aa3a8,pit:0x050606,dotRing:0x8c949c,dotRingOp:0.3,swell:0xffffff,swk:0.75,
  card:'rgba(24,27,31,0.94)',cardLine:'rgba(195,204,208,0.35)',sub:'#a3acb2',usedTxt:'#9cc8ff',depTxt:'#ff8a5c'}
:{g:['#ece7de','#e4ded3','#d8d1c5'],side:0xa29b90,rim:0x8c877e,ring:0x6e6a63,ringOp:0.22,tone:'#837e76',tower:0xd6d2ca,towerOp:0.95,lit:0.16,glow:0.84,edge:0x88837a,edgeOp:0.5,floorOp:0.35,focus:0x26292c,call:0x33373b,callA:0.75,inner:0x2b2e31,label:'#26292c',shadow:'rgba(240,235,226,0.95)',used:0x1d4f91,dep:0xc8501a,ext:0xa3560a,extA:0.7,event:0x5a2fc0,ghost:0x77726a,pit:0x6e6a63,dotRing:0x88837a,dotRingOp:0.4,swell:0xfffdf7,swk:0.85,
  card:'rgba(248,245,239,0.96)',cardLine:'rgba(120,114,104,0.55)',sub:'#5f5a52',usedTxt:'#1d4f91',depTxt:'#a8400f'};
// a lit label in a query: tinted toward the accent, pale in the light theme so its text stays dark
const LITLAB=DARK?0x85B7EB:0xC9DEF4;
// complexity, shown in the details and search only: one hue in three steps; an external has none and keeps its own
const LEVELC=DARK?{simple:0x184F95,mid:0x3987E5,complex:0x9EC5F4}:{simple:0x86B6EF,mid:0x2A78D6,complex:0x104281};
const EXTC=0xEFB860;
// LV: the height of a level; SH: a level-0 tower's height; TAPER: a tower's foot as a share of its roof
const LV=3.2,SH=1.8,TAPER=0.55;
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function rnd(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);}
// FNV-1a, 32 bits
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),0x01000193);return h>>>0;}
// a lane: one quiet colour, brighter toward the end it lands on, with a faint swell of light drifting that way; dashed
// (uDash: the dash period) for implements, tbd holes and events
const EVS='varying float vU;void main(){vU=uv.x;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
const EFS='uniform vec3 uCol,uSw;uniform float uA,uT,uPh,uSp,uLen,uG0,uSoft,uSwK,uDash;varying float vU;void main(){if(uDash>0.0&&fract(vU*uLen/uDash)>0.62)discard;float a=uA*(uG0+(1.0-uG0)*vU);float sp=fract(uT*uSp+uPh)*1.5-0.25;float sw=uSoft*exp(-pow((vU-sp)/0.14,2.0));gl_FragColor=vec4(mix(uCol,uSw,sw*uSwK),clamp(a+sw*uA*0.9,0.0,1.0));}';

// ---------- model: the loaded world, as scene.js sees it ----------
const MAP=mapScene(JSON.parse(document.getElementById('nuhokai-world').textContent));
// the page's title is the top level's name: the world's name, as the first breadcrumb shows it
document.title=scopeView(MAP,null).name;
const LAYOUTS={};const layoutOf=scope=>LAYOUTS[scope===null?'world':scope]=LAYOUTS[scope===null?'world':scope]||{};
// moved positions, kept per browser under one key per world: {scope: {item: {x,z} or {ang}}}. The key ends in the world's
// id, since every file:// map shares one storage; the scope is the world's id or its dome's node id, the item its node
// id, so a regenerated map reuses them for the nodes it still has. Storage may be unavailable.
const STORE='nuhokai.map.layout.'+MAP.world.id;
function stored(){try{const all=JSON.parse(localStorage.getItem(STORE));return all&&typeof all==='object'?all:{};}catch(e){return {};}}
function store(all){try{localStorage.setItem(STORE,JSON.stringify(all));}catch(e){}}
const scopeKey=scope=>scope===null?MAP.world.id:MAP.nodes[scope].id;
// a hole has no id: its description and users key it, so two holes with one description keep apart
const keyOf=sp=>sp.node?sp.node.id:sp.kind==='hole'?'tbd:'+sp.item.name+':'+sp.item.users.join(','):sp.id;
function remember(sp,pos){const all=stored(),k=scopeKey(S.scope);all[k]=Object.assign({},all[k],{[keyOf(sp)]:pos});store(all);}
function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

// ---------- geometry helpers ----------
function circlePts(r){const a=[];for(let i=0;i<=64;i++){const t=i/64*Math.PI*2;a.push(V(Math.cos(t)*r,0,Math.sin(t)*r));}return a;}
function convexHull(P){P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}up.pop();lo.pop();return lo.concat(up);}
// a three.js colour as CSS
const cssColor=c=>'#'+new THREE.Color(c).getHexString();
// an element with a class and text, appended to parent
const make=(tag,cls,txt,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(parent)parent.appendChild(e);return e;};
// a canvas as a sprite standing on its bottom edge, k world units per pixel
function spriteOf(cv,k){const tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));sp.center.set(0.5,0);sp.scale.set(cv.width*k,cv.height*k,1);sp.renderOrder=10;return sp;}
function card(x,w,h){x.fillStyle=TH.card;x.strokeStyle=TH.cardLine;x.lineWidth=2;x.beginPath();if(x.roundRect)x.roundRect(1,1,w-2,h-2,10);else x.rect(1,1,w-2,h-2);x.fill();x.stroke();}

function resetLayout(){if(trans)return;const all=stored();delete all[scopeKey(S.scope)];store(all);delete LAYOUTS[S.scope===null?'world':S.scope];load(S.scope);resetView();}
document.getElementById('resetBtn').addEventListener('click',resetView);
document.getElementById('layoutBtn').addEventListener('click',resetLayout);
document.getElementById('conesBtn').addEventListener('click',toggleCones);
document.getElementById('helpBtn').addEventListener('click',()=>helpDlg.showModal());
helpDlg.querySelector('.d-close').addEventListener('click',()=>helpDlg.close());
// a click on the backdrop closes the help; a click inside it, or a selection dragged out of it, does not
let helpDown=null;helpDlg.addEventListener('pointerdown',e=>{helpDown=e.target;});
helpDlg.addEventListener('click',e=>{if(e.target===helpDlg&&helpDown===helpDlg)helpDlg.close();});

// ---------- search ----------
// every node, port and tbd hole in the world, whatever scope is open; a hit lands in its home scope, centred and selected
function searching(){return q.value.trim()!=='';}
// a jump or a map click clears the query but keeps it and its row: / or Ctrl/⌘K on an empty box brings them back; Escape
// forgets it; a blank one never replaces the one kept
function clearQuery(keep){if(!q.value)return;if(!keep)lastQ=null;else if(searching())lastQ={v:q.value,cur:cur};q.value='';onQuery();}
function restoreQuery(){if(!q.value&&lastQ){q.value=lastQ.v;onQuery();setCur(lastQ.cur,true);q.select();}}
function openSearch(){restoreQuery();q.focus();q.select();}
function onQuery(){HITS=search(MAP,q.value);cur=0;renderHits();applyState();
const n=HITS.length;if(searching())say(n?(n>SHOWN?SHOWN+' of '+n:n)+(n===1?' result':' results')+(here.hidden?'':', none in this view'):'No matches',true);else say('');}
// a hit's home scope below the world, as its row shows it and a screen reader names it
function where(h){const p=h.path.slice(1).map(c=>c.name);return p.length?p.join(' › '):'top';}
function rowName(h){const w=h.path.length>1?'in '+where(h):'at the top';return h.kind==='port'?h.port+', port of '+MAP.nodes[h.node].name+', '+w:h.kind==='node'?h.label+', node, '+w:h.label+', '+w;}
// the one active row: arrows and the mouse move it, Enter takes it
function setCur(i,scroll){const old=document.getElementById('hit'+cur);if(old)old.setAttribute('aria-selected','false');cur=i;const row=document.getElementById('hit'+i);if(!row)return;row.setAttribute('aria-selected','true');q.setAttribute('aria-activedescendant',row.id);if(scroll)row.scrollIntoView({block:'nearest'});}
function renderHits(){hitList.innerHTML='';const on=searching();hitList.hidden=!on;q.setAttribute('aria-expanded',String(on));q.removeAttribute('aria-activedescendant');if(!on)return;
const mk=(tag,cls,parent)=>make(tag,cls,null,parent);
if(!HITS.length){mk('div','h-none',hitList).textContent='No matches';return;}
HITS.slice(0,SHOWN).forEach((h,i)=>{const row=mk('div',h.kind==='hole'?'hit hole':'hit',hitList);row.id='hit'+i;row.setAttribute('role','option');row.setAttribute('aria-selected','false');row.setAttribute('aria-label',rowName(h));
// a complexity dot (a hole's dashed), then the label in runs, the matched characters bold
const name=mk('div','h-name',row),dot=mk('i','h-dot',name),bold=new Set(h.positions);if(h.node!==null)dot.style.background=swatch((MAP.complexity[h.node]||{}).level);let from=0;for(let j=1;j<=h.label.length;j++)if(j===h.label.length||bold.has(j)!==bold.has(from)){const s=h.label.slice(from,j);if(bold.has(from))mk('b',null,name).textContent=s;else name.appendChild(document.createTextNode(s));from=j;}
mk('div','h-path',row).textContent=where(h);
row.addEventListener('mousedown',e=>e.preventDefault());// a moving mouse only: a list scrolled under a still one keeps the arrows' row
row.addEventListener('mousemove',e=>{if((e.movementX||e.movementY)&&cur!==i)setCur(i,false);});row.addEventListener('click',()=>jump(h));});
setCur(cur,true);
if(HITS.length>SHOWN){const more=mk('div','h-more',hitList);more.textContent=SHOWN+' of '+HITS.length+' — keep typing';more.addEventListener('mousedown',e=>e.preventDefault());}}
// same scope: glide there; inside an island here: dive into it; elsewhere: fade out as going up does, load it, fade in;
// each lands centred on the hit at the scope's home zoom. A hit chosen during a move waits for it, the latest one wins
function jump(h){if(q.value){cur=HITS.indexOf(h);clearQuery(true);}q.blur();if(trans){queued=h;return;}fly({scope:h.scope,path:h.path,key:h.key,ports:h.port?[h.port]:[]});}
// to a destination: its scope and the path there, the item to land on, the ports to mark (a search hit's one, a double-click's landingOf)
function fly(h){const to=h.path.map(c=>c.scope),depth=path.length,into=to.length>depth&&to[depth-1]===S.scope&&S.items['node:'+to[depth]];
if(h.scope===S.scope){const it=S.items[h.key];if(!it)return;trans={kind:'home',t:0,fromT:controls.target.clone(),toT:V(it.base.x,it.y,it.base.z),fromZ:camera.zoom,toZ:HOME.zoom,fromP:camera.position.clone(),sel:h.key,ports:h.ports};}
else if(into)trans=dive(into,to,h);
else trans={kind:'out1',t:0,fromZ:camera.zoom,toZ:camera.zoom*0.25,path:to,sel:h.key,ports:h.ports};
controls.enabled=false;tip.style.display='none';}
q.addEventListener('input',onQuery);
// touch screens have no / key: a tap into the empty box brings the query back
if(TOUCH)q.addEventListener('focus',restoreQuery);else q.placeholder='Search  / or '+(APPLE?'⌘K':'Ctrl K');
// an IME's commit Enter is the IME's: WebKit sends it with isComposing false and keyCode 229
q.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;const n=Math.min(HITS.length,SHOWN);
if((e.key==='ArrowDown'||e.key==='ArrowUp')&&n){e.preventDefault();setCur((cur+(e.key==='ArrowDown'?1:n-1))%n,true);}
else if(e.key==='Enter'){e.preventDefault();if(HITS[cur])jump(HITS[cur]);}
else if(e.key==='Escape'){e.preventDefault();if(q.value)clearQuery(false);else q.blur();}});

// ---------- input ----------
const ray=new THREE.Raycaster();let down=null,drag=null;
function setRay(e){const r=el.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1),camera);}
function hitAt(e){setRay(e);const h=ray.intersectObjects(S.pick)[0];return h?h.object.userData:null;}
function planeHit(e,y){setRay(e);const p=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(UPV,-y),p)?p:null;}
function outsideBoard(e){const r=layoutOf(S.scope).ring;const p=planeHit(e,0);return !p||Math.hypot(p.x-r.cx,p.z-r.cz)>S.D;}
wrap.addEventListener('pointerdown',e=>{tip.style.display='none';if(trans||e.target!==el)return;
if(e.button===0){const h=hitAt(e);
if(h&&h.id&&S.items[h.id]&&S.items[h.id].kind!=='empty'){const it=S.items[h.id];drag={kind:'item',id:h.id,x:e.clientX,y:e.clientY,moved:false,py:it.kind==='comp'?it.roof:0.1};controls.enabled=false;return;}
if(h&&h.pillar){const rec=S.pillars.find(r=>r.gr.id===h.pillar);const p=planeHit(e,0.02);if(rec&&p){drag={kind:'pillar',rec:rec,x:e.clientX,y:e.clientY,moved:false,a0:Math.atan2(p.z,p.x),start:rec.memb.map(id=>({id:id,a:Math.atan2(S.items[id].base.z,S.items[id].base.x)}))};controls.enabled=false;return;}}}
down={x:e.clientX,y:e.clientY,b:e.button};wrap.style.cursor='grabbing';},true);
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&dx*dx+dy*dy<20)return;drag.moved=true;wrap.style.cursor='grabbing';
if(drag.kind==='item'){const p=planeHit(e,drag.py);if(p)moveItem(drag.id,p.x,p.z);}else{const p=planeHit(e,0.02);if(p){const d=Math.atan2(p.z,p.x)-drag.a0;drag.start.forEach(s=>moveItem(s.id,Math.cos(s.a+d),Math.sin(s.a+d)));}}});
el.addEventListener('pointermove',e=>{if(drag||e.buttons||trans)return;const h=hitAt(e);const key=h?(h.id||(h.air!==undefined?'air:'+h.air:(h.pillar?'pillar:'+h.pillar:(h.route?'route:'+h.route:null)))):null;const id=h&&h.id&&S.items[h.id]&&S.items[h.id].kind!=='empty'?h.id:null;if(id!==S.hover){S.hover=id;applyState();}
if(key&&S.labels[key]){tip.textContent=S.labels[key];tip.style.display='block';tip.style.left=Math.max(4,Math.min(e.clientX+14,W()-tip.offsetWidth-8))+'px';tip.style.top=Math.max(4,Math.min(e.clientY+14,H()-tip.offsetHeight-8))+'px';wrap.style.cursor=h.pillar&&!h.id?'move':'pointer';}else{tip.style.display='none';wrap.style.cursor='grab';}});
window.addEventListener('pointerup',e=>{wrap.style.cursor='grab';
if(drag){if(!drag.moved){clearQuery(true);select(drag.kind==='item'?drag.id:null);}else routeAll();drag=null;if(!trans)controls.enabled=true;return;}
if(down&&down.b===0&&!trans&&e.target===el){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(dx*dx+dy*dy<25){const h=hitAt(e);clearQuery(true);select(h&&h.id?h.id:null);}}down=null;});
el.addEventListener('dblclick',e=>{if(trans)return;const h=hitAt(e);if(h&&h.id){const it=S.items[h.id];if(it&&it.kind==='comp'&&it.sp.item.dome){enter(h.id);return;}const to=landingOf(MAP,S.view,h.id);if(to)fly(to);return;}if(path.length>1&&outsideBoard(e))goUp();});
el.addEventListener('pointerleave',()=>{tip.style.display='none';if(S.hover){S.hover=null;applyState();}});
el.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
// the open help owns the keys: Escape closes it, nothing reaches the map
if(helpDlg.open)return;
if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){e.preventDefault();openSearch();return;}
// keys typed in the search box are the box's own: never a way up
if(e.target===q)return;
if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();openSearch();return;}
if(e.key==='?'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();helpDlg.showModal();return;}
if(e.key==='Escape'&&searching()){clearQuery(false);return;}
if(e.key==='Escape'&&(sel||S.mark)){select(null);return;}if((e.key==='Escape'||e.key==='Backspace')&&path.length>1){e.preventDefault();goUp();}});
window.addEventListener('resize',()=>{renderer.setSize(W(),H());frustum();computeHome();});
load(null);camAt(HOME.t,HOME.zoom);controls.update();

// ---------- loop ----------
const timer=new THREE.Timer();timer.connect(document);const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);const io2=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function loop(t){requestAnimationFrame(loop);timer.update(t);const dt=Math.min(timer.getDelta(),0.05);T+=dt;
if(trans){trans.t+=dt;const k=Math.min(1,trans.t/0.7),e=io2(k);
if(trans.kind==='in1'){const tt=trans.fromT.clone().lerp(trans.toT,e);camera.position.copy(trans.fromP).add(tt.clone().sub(trans.fromT));controls.target.copy(tt);camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camera.updateProjectionMatrix();camera.lookAt(tt);el.style.opacity=String(1-Math.max(0,(k-0.5)/0.5));
if(k>=1){const tr=trans;path=tr.path;load(path[path.length-1]);const it=tr.sel&&S.items[tr.sel];const c=it?V(it.base.x,it.y,it.base.z):HOME.t.clone();camAt(c,HOME.zoom*0.3);trans={kind:'in2',t:0,fromT:c,toT:c.clone(),fromZ:HOME.zoom*0.3,toZ:HOME.zoom,sel:tr.sel,ports:tr.ports};}}
else if(trans.kind==='out1'){camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camera.updateProjectionMatrix();el.style.opacity=String(1-Math.max(0,(k-0.4)/0.6));
if(k>=1){const tr=trans;path=tr.path;load(path[path.length-1]);const it=S.items[tr.sel||tr.from];const c=it?V(it.base.x,it.y,it.base.z):HOME.t.clone();
// going up starts close on the dome just left and widens to the scope; a search hit starts close and stays centred on it
const z0=HOME.zoom*(tr.sel?0.6:6);camAt(c,z0);trans={kind:'in2',t:0,fromT:c,toT:tr.sel?c.clone():HOME.t.clone(),fromZ:z0,toZ:HOME.zoom,sel:tr.sel,ports:tr.ports};}}
else if(trans.kind==='in2'){const tt=trans.fromT.clone().lerp(trans.toT,e);camera.zoom=trans.fromZ*Math.pow(trans.toZ/trans.fromZ,e);camAt(tt);el.style.opacity=String(Math.min(1,k*2));if(k>=1){const s=trans.sel,p=trans.ports;trans=null;controls.enabled=true;controls.update();if(s){land(s,p);flashCrumbs();}moved();}}
else if(trans.kind==='home'){const tt=trans.fromT.clone().lerp(trans.toT,e);const dirNow=trans.fromP.clone().sub(trans.fromT).normalize().lerp(CAMDIR,e).normalize();controls.target.copy(tt);camera.position.copy(tt).addScaledVector(dirNow,110);camera.zoom=trans.fromZ+(trans.toZ-trans.fromZ)*e;camera.updateProjectionMatrix();camera.lookAt(tt);if(k>=1){const s=trans.sel,p=trans.ports;trans=null;controls.enabled=true;controls.update();if(s)land(s,p);moved();}}}
else if(!drag)controls.update();
const lt=T-S.T0;
S.anims.forEach(a=>{const e=ease((lt-a.delay)/0.6);a.it.g.position.y=0.8*(1-e);});
// lanes show once the towers have landed; their swell drifts on
const ready=lt>0.9;[...S.lanes,...S.air].forEach(o=>{o.shown=ready;if(o.tube)o.tube.visible=ready;o.mat.uniforms.uT.value=T;});
renderer.render(scene,camera);}
loop();
</script>
